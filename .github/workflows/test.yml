name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=pipeline \
            --cov-report=term-missing \
            --cov-report=xml \
            --tb=short

      - name: Check methodology.json is valid
        run: |
          python3 -c "
          import json
          with open('methodology.json') as f:
              m = json.load(f)
          weights = [v['weight'] for v in m['components'].values()]
          total = sum(weights)
          assert abs(total - 1.0) < 1e-9, f'Weights sum to {total}'
          print(f'methodology.json valid ✓ (weights sum to {total:.6f})')
          "
